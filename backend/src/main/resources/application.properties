spring.application.name=depotiq-backend

spring.datasource.url=${DEPOTIQ_DB_URL:jdbc:postgresql://localhost:5432/depotiq}
spring.datasource.username=${DEPOTIQ_DB_USERNAME:depotiq}
spring.datasource.password=${DEPOTIQ_DB_PASSWORD:depotiq}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${DEPOTIQ_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

server.port=8080

depotiq.ml-service.base-url=${DEPOTIQ_ML_SERVICE_URL:http://localhost:8000}
depotiq.cors.allowed-origins=${DEPOTIQ_CORS_ALLOWED_ORIGINS:http://localhost:5173}
