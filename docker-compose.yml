services:
  postgres:
    image: postgres:16
    container_name: depotiq-postgres
    environment:
      POSTGRES_DB: depotiq
      POSTGRES_USER: depotiq
      POSTGRES_PASSWORD: depotiq
    ports:
      - "5432:5432"
    volumes:
      - depotiq-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U depotiq -d depotiq"]
      interval: 5s
      timeout: 5s
      retries: 10

  ml-service:
    build:
      context: .
      dockerfile: ml-service/Dockerfile
    environment:
      PYTHONPATH: /app/ml-service
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DEPOTIQ_DB_URL: jdbc:postgresql://postgres:5432/depotiq
      DEPOTIQ_DB_USERNAME: depotiq
      DEPOTIQ_DB_PASSWORD: depotiq
      DEPOTIQ_ML_SERVICE_URL: http://ml-service:8000
      DEPOTIQ_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8080
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  depotiq-postgres-data:

