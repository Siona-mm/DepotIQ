name: depotiq

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: depotiq
      POSTGRES_USER: depotiq
      POSTGRES_PASSWORD: depotiq
    ports:
      - "5432:5432"
    volumes:
      - depotiq-postgres-data:/var/lib/postgresql/data
    networks:
      - depotiq-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U depotiq -d depotiq"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ml-service:
    build:
      context: .
      dockerfile: ml-service/Dockerfile
    environment:
      PYTHONPATH: /app/ml-service
    ports:
      - "8000:8000"
    networks:
      - depotiq-network
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DEPOTIQ_DB_URL: jdbc:postgresql://postgres:5432/depotiq
      DEPOTIQ_DB_USERNAME: depotiq
      DEPOTIQ_DB_PASSWORD: depotiq
      DEPOTIQ_ML_SERVICE_URL: http://ml-service:8000
      DEPOTIQ_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_started
    ports:
      - "8081:8080"
    networks:
      - depotiq-network
    restart: on-failure

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: ""
      VITE_API_PROXY_TARGET: http://backend:8080
    depends_on:
      backend:
        condition: service_started
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    networks:
      - depotiq-network
    restart: unless-stopped

  airflow-postgres:
    image: postgres:16
    profiles: ["airflow"]
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    networks:
      - depotiq-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    image: apache/airflow:2.10.5-python3.12
    profiles: ["airflow"]
    environment: &airflow-environment
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      DEPOTIQ_BACKEND_URL: http://backend:8080
      DEPOTIQ_IMPORT_USERNAME: admin
      DEPOTIQ_IMPORT_PASSWORD: admin123
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./data/imports:/opt/airflow/imports
    depends_on:
      airflow-postgres:
        condition: service_healthy
    networks:
      - depotiq-network
    command: >
      bash -c "airflow db migrate &&
      (airflow users create --username admin --password admin123 --firstname DepotIQ --lastname Admin --role Admin --email admin@depotiq.local || true)"

  airflow-webserver:
    image: apache/airflow:2.10.5-python3.12
    profiles: ["airflow"]
    environment: *airflow-environment
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./data/imports:/opt/airflow/imports
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      backend:
        condition: service_started
    ports:
      - "8082:8080"
    networks:
      - depotiq-network
    command: webserver

  airflow-scheduler:
    image: apache/airflow:2.10.5-python3.12
    profiles: ["airflow"]
    environment: *airflow-environment
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./data/imports:/opt/airflow/imports
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      backend:
        condition: service_started
    networks:
      - depotiq-network
    command: scheduler

volumes:
  depotiq-postgres-data:
  frontend-node-modules:
  airflow-postgres-data:

networks:
  depotiq-network:
    driver: bridge
